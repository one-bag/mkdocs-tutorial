<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="860" height="330" role="img" aria-label="Diagram of the GitHub Pages settings screen, with the Source dropdown set to GitHub Actions">
  <style>
    .bg    { fill: #ffffff; }
    .card  { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.5; }
    .band  { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .field { fill: #ffffff; stroke: #8c959f; stroke-width: 1.5; }
    .t     { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #1f2328; }
    .muted { fill: #59636e; }
    .crumb { font-size: 15px; }
    .h     { font-size: 19px; font-weight: 600; }
    .lbl   { font-size: 15px; font-weight: 600; }
    .val   { font-size: 16px; }
    .note  { font-size: 14px; fill: #00695c; font-weight: 600; }
    .warn  { font-size: 14px; fill: #9a3412; }
    .arrow { stroke: #00695c; stroke-width: 2; fill: none; }
  </style>

  <rect class="bg" x="0" y="0" width="860" height="330"/>

  <text class="t crumb muted" x="24" y="30">Settings  &#8250;  Pages</text>

  <rect class="card" x="24" y="48" width="600" height="196" rx="8"/>
  <path d="M24 94 L24 56 A8 8 0 0 1 32 48 L616 48 A8 8 0 0 1 624 56 L624 94 Z" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text class="t h" x="44" y="79">Build and deployment</text>

  <text class="t lbl" x="44" y="128">Source</text>

  <rect class="field" x="44" y="144" width="280" height="42" rx="6"/>
  <text class="t val" x="60" y="171">GitHub Actions</text>
  <path d="M296 161 l8 9 8 -9" stroke="#1f2328" stroke-width="2" fill="none"/>

  <text class="t warn" x="44" y="216">The other option, Deploy from a branch, will not work here.</text>

  <path class="arrow" d="M336 165 C 380 165, 400 150, 436 150"/>
  <path d="M436 150 l-11 -5 l0 10 z" fill="#00695c"/>
  <text class="t note" x="446" y="146">Choose this one.</text>
  <text class="t note" x="446" y="168">There is no save button:</text>
  <text class="t note" x="446" y="190">it applies immediately.</text>

  <text class="t crumb muted" x="24" y="286">Diagram, not a screenshot. The wording on your screen may differ slightly,</text>
  <text class="t crumb muted" x="24" y="308">but the setting to change is always the one labelled Source.</text>
</svg>
