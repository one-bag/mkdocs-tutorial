name: Publish documentation

# Run this every time something is pushed to the main branch, on every pull
# request aimed at main, and when you click "Run workflow" in the Actions tab.
# Pull requests are built and checked but not published: that way a change is
# proved to work before anyone merges it.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Permissions GitHub Pages needs in order to publish the site.
permissions:
  contents: read
  pages: write
  id-token: write

# If two pushes to the same branch happen close together, let them queue rather
# than fight. Each pull request gets its own queue.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      - name: Get the files
        uses: actions/checkout@v7
        with:
          # The whole history, so the plugin that shows "last updated" dates
          # can read when each page was really changed.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install MkDocs
        run: pip install -r requirements.txt

      # First prove the checker still detects the bugs it was written for.
      # A checker nobody tests is worse than none: it licenses you to stop
      # looking.
      - name: Test the checker itself
        run: python3 tools/check_tutorial.py --self-test

      # Then use it. This catches the tutorial promising something the reader's
      # own setup will not do yet. See tools/check_tutorial.py.
      - name: Check the tutorial against the reader's setup
        run: python3 tools/check_tutorial.py

      - name: Build the site
        run: mkdocs build --strict

      - name: Prepare GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Put it online
    needs: build
    # Pull requests stop after the build above. Only main gets published.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
