name: Publish documentation

# Run this every time something is pushed to the main branch,
# and also when you click "Run workflow" by hand in the Actions tab.
on:
  push:
    branches:
      - main
  workflow_dispatch:

# Permissions GitHub Pages needs in order to publish the site.
permissions:
  contents: read
  pages: write
  id-token: write

# If two pushes happen close together, let the newest one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      - name: Get the files
        uses: actions/checkout@v7
        with:
          # The whole history, so the plugin that shows "last updated" dates
          # can read when each page was really changed.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install MkDocs
        run: pip install -r requirements.txt

      - name: Build the site
        run: mkdocs build --strict

      - name: Prepare GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Put it online
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
